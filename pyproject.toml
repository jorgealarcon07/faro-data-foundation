[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faro-data-foundation"
version = "0.1.0"
description = "Verifiable data close: source-to-publication with PostgreSQL and dbt"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openpyxl==3.1.5", "pyarrow==26.0.1", "psycopg[binary]==3.3.9",
  "dbt-core==1.12.7", "dbt-postgres==1.11.0", "jsonschema==4.26.0", "psutil==7.2.2"
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.5", "playwright==1.65.2"]

[project.scripts]
faro = "faro_foundation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
faro_foundation = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires PostgreSQL and dbt", "airflow: requires Linux Airflow runtime"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

